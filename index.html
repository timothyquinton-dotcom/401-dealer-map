  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: Arial, sans-serif; background: #f5f5f5; }
    #map { height: 65vh; width: 100%; }

    .custom-layer-control {
      background: white;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 55vh;
      overflow-y: auto;
      min-width: 190px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-size: 12px;
    }
    .layer-control-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 7px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .brand-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
    }
    .brand-toggle label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    .brand-logo-sm {
      width: 20px;
      height: 20px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    #dealer-table-wrapper { padding: 20px; }
    .brand-section { margin-bottom: 28px; }
    .brand-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #222;
      padding-bottom: 5px;
      border-bottom: 2px solid #c00;
      margin-bottom: 6px;
    }
    .brand-heading img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .dealer-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dealer-table td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    .dealer-table tr:hover td { background: #fafafa; }
    .dealer-table td:first-child { color: #888; white-space: nowrap; }
    .dealer-table td a { color: #c00; text-decoration: none; }
    .dealer-table td a:hover { text-decoration: underline; }

    .leaflet-popup-content-wrapper { border-radius: 8px; }
    .leaflet-popup-content { margin: 12px 16px; min-width: 200px; }
    .popup-brand { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 3px; }
    .popup-name { font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .popup-row { font-size: 12px; color: #555; margin: 3px 0; }
    .popup-row a { color: #c00; text-decoration: none; }
  </style>
</head>

const map = L.map('map').setView([45.5, -80.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

function getIcon(brand) {
  return L.divIcon({
    html: `<img src="${BASE}${brandLogos[brand]||'401group.png'}" style="width:36px;height:36px;object-fit:contain;mix-blend-mode:multiply;">`,
    className: '',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -22]
  });
}

const layerGroups = {};
const brandVisible = {};
const brands = [...new Set(dealers.map(d => d.brand))].sort();

brands.forEach(b => {
  layerGroups[b] = L.layerGroup().addTo(map);
  brandVisible[b] = true;
});

dealers.forEach(d => {
  const popup = `
    <div class="popup-brand">${d.brand}</div>
    <div class="popup-name">${d.name}</div>
    <div class="popup-row">📍 ${d.address}</div>
    <div class="popup-row">📞 <a href="tel:${d.phone}">${d.phone}</a></div>
    <div class="popup-row">🌐 <a href="https://${d.website}" target="_blank">${d.website}</a></div>
  `;
  L.marker([d.lat, d.lng], {icon: getIcon(d.brand)}).bindPopup(popup).addTo(layerGroups[d.brand]);
});

// Custom layer control
const CustomControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'custom-layer-control');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    // All checkbox
    const header = L.DomUtil.create('div', 'layer-control-header', div);
    const allCb = document.createElement('input');
    allCb.type = 'checkbox'; allCb.id = 'cb-all'; allCb.checked = true;
    const allLbl = document.createElement('label');
    allLbl.htmlFor = 'cb-all'; allLbl.textContent = 'All Locations';
    header.appendChild(allCb); header.appendChild(allLbl);

    allCb.addEventListener('change', function() {
      brands.forEach(b => {
        brandVisible[b] = this.checked;
        const cb = document.getElementById('cb-' + b);
        if (cb) cb.checked = this.checked;
        this.checked ? map.addLayer(layerGroups[b]) : map.removeLayer(layerGroups[b]);
      });
      updateTable();
    });

    // Brand toggles
    brands.forEach(b => {
      const count = dealers.filter(d => d.brand === b).length;
      const row = L.DomUtil.create('div', 'brand-toggle', div);
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'cb-' + b; cb.checked = true;
      const lbl = document.createElement('label');
      lbl.htmlFor = 'cb-' + b;
      lbl.innerHTML = `<img class="brand-logo-sm" src="${BASE}${brandLogos[b]||'401group.png'}"> ${b} <span style="color:#aaa">(${count})</span>`;
      row.appendChild(cb); row.appendChild(lbl);

      cb.addEventListener('change', function() {
        brandVisible[b] = this.checked;
        this.checked ? map.addLayer(layerGroups[b]) : map.removeLayer(layerGroups[b]);
        const allChecked = brands.every(br => brandVisible[br]);
        const anyChecked = brands.some(br => brandVisible[br]);
        const allCb = document.getElementById('cb-all');
        allCb.checked = allChecked;
        allCb.indeterminate = !allChecked && anyChecked;
        updateTable();
      });
    });

    return div;
  }
});
new CustomControl().addTo(map);

function updateTable() {
  const wrapper = document.getElementById('dealer-table-wrapper');
  wrapper.innerHTML = '';
  brands.forEach(b => {
    if (!brandVisible[b]) return;
    const brandDealers = dealers.filter(d => d.brand === b);
    if (!brandDealers.length) return;

    const section = document.createElement('div');
    section.className = 'brand-section';

    const heading = document.createElement('div');
    heading.className = 'brand-heading';
    heading.innerHTML = `<img src="${BASE}${brandLogos[b]||'401group.png'}"> ${b}`;
    section.appendChild(heading);

    const table = document.createElement('table');
    table.className = 'dealer-table';
    brandDealers.forEach(d => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${d.brand}</td>
        <td>${d.name}</td>
        <td>${d.address}</td>
        <td><a href="tel:${d.phone}">${d.phone}</a></td>
        <td><a href="https://${d.website}" target="_blank">${d.website}</a></td>
      `;
      table.appendChild(tr);
    });
    section.appendChild(table);
    wrapper.appendChild(section);
  });
}

updateTable();
